<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hammond Collection Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A6%96</text></svg>">
<style>
/* tema: preto como cor principal, abas fixas na esquerda (viram uma tira
   horizontal no topo no celular), e uma secao de "Destaques" com os
   melhores precos do momento, selecionada por padrao ao abrir o site. */
:root{
  --bg:#070707;
  --surface:#121212;
  --surface-2:#1a1a1a;
  --ink:#f2f1ec;
  --muted:#8f8a7e;
  --line:#272420;
  --accent:#f0a93a;
  --accent-ink:#1a1206;
  --good:#4caf6e;
  --warn:#e2634f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, sans-serif;
}
img{max-width:100%}
h1,h2,h3{font-family:"Fraunces", Georgia, serif;margin:0}
a{color:inherit}

.app{
  display:flex;
  min-height:100vh;
}

/* ---- sidebar (vira tira horizontal no celular) ---- */
aside.sidebar{
  flex:none;
  width:230px;
  background:var(--surface);
  border-right:1px solid var(--line);
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  padding:18px 0 24px;
}
.brand{
  padding:0 18px 16px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.brand h1{font-size:1.15rem;font-weight:600;line-height:1.25}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:.74rem;margin-top:4px}

.status{
  display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--muted);
  padding:10px 18px 2px;font-variant-numeric:tabular-nums;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.stale{background:var(--warn)}
button.refresh{
  margin:8px 18px 14px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:7px;padding:6px 10px;font-size:.76rem;cursor:pointer;width:calc(100% - 36px);
}
button.refresh:hover{border-color:var(--accent)}

nav.tabs{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
nav.tabs button{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:none;background:transparent;color:var(--muted);
  padding:9px 10px;border-radius:8px;font-size:.87rem;cursor:pointer;text-align:left;
  font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
nav.tabs button .count{
  color:var(--muted);font-variant-numeric:tabular-nums;font-size:.72rem;flex:none;
}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{
  background:var(--accent);color:var(--accent-ink);font-weight:600;
}
nav.tabs button[aria-selected="true"] .count{color:var(--accent-ink);opacity:.75}
nav.tabs button.highlight-tab{color:var(--accent)}
nav.tabs button.highlight-tab[aria-selected="true"]{color:var(--accent-ink)}
nav.tabs .divider{height:1px;background:var(--line);margin:8px 10px}

/* ---- conteudo principal ---- */
main{flex:1;min-width:0;padding:22px 24px 48px}
.main-head{margin-bottom:16px}
.main-head h2{font-size:1.3rem;font-weight:600}
.main-head .sub{color:var(--muted);font-size:.82rem;margin-top:3px}

.empty{
  border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;
  color:var(--muted);
}
.empty strong{color:var(--ink);display:block;margin-bottom:6px;font-size:1.05rem}
.empty code{
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  font-size:.85em;
}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;
}

a.card{
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;min-width:0;
  transition:border-color .15s ease, transform .15s ease;
}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.card.deal{border-color:var(--good)}

.thumb{aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{color:var(--muted);font-size:1.6rem}

.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.price-row{display:flex;align-items:center;gap:7px}
.price{font-family:"Fraunces",Georgia,serif;font-size:1.2rem;font-weight:600;color:var(--accent)}
.deal-badge{
  font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--good);
  border:1px solid currentColor;border-radius:4px;padding:1px 5px;
}
.cat-pill{
  font-size:.64rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:1px 8px;align-self:flex-start;
}
.ctitle{
  font-size:.83rem;color:var(--ink);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--muted)}
.badge{
  font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--warn);
  border:1px solid currentColor;border-radius:4px;padding:1px 5px;align-self:flex-start;
}

.highlights-section{margin-bottom:30px}
.highlights-section .main-head h2::before{content:"\1F525  ";}

footer{color:var(--muted);font-size:.72rem;padding-block:18px 10px}
footer a{color:var(--accent)}

/* ---- celular: sidebar vira tira horizontal no topo ---- */
@media (max-width: 760px){
  .app{flex-direction:column}
  aside.sidebar{
    width:100%;height:auto;position:sticky;top:0;z-index:5;
    border-right:none;border-bottom:1px solid var(--line);
    padding:12px 0;
  }
  .brand{padding:0 14px 10px;margin-bottom:8px}
  .status{padding:0 14px 8px}
  button.refresh{margin:0 14px 10px;width:calc(100% - 28px)}
  nav.tabs{
    flex-direction:row;overflow-x:auto;padding:2px 10px 4px;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:none}
  nav.tabs .divider{width:1px;height:28px;margin:0 4px}
  main{padding:18px 14px 40px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Hammond <em>Collection</em></h1>
      <div class="sub">Anuncios ativos no eBay &middot; Jurassic World, Mattel</div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="updated">carregando&hellip;</span>
    </div>
    <button class="refresh" id="refreshBtn" type="button">Atualizar agora</button>
    <nav class="tabs" id="tabs" aria-label="Categorias"></nav>
  </aside>

  <main id="main">
    <div class="empty">
      <strong>Carregando anuncios&hellip;</strong>
      Buscando os dados mais recentes.
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var DATA_URL = "data/listings.json";
  var POLL_MS = 120000; // reconsulta a cada 2 min (o arquivo em si muda a cada 10 min)
  var HIGHLIGHTS_ID = "__highlights__";
  var HIGHLIGHTS_COUNT = 12;

  var state = { categories: [], updatedAt: null, activeTab: HIGHLIGHTS_ID };

  var tabsEl = document.getElementById("tabs");
  var mainEl = document.getElementById("main");
  var updatedEl = document.getElementById("updated");
  var dotEl = document.getElementById("dot");
  var refreshBtn = document.getElementById("refreshBtn");

  function fmtPrice(value, currency){
    if (value == null) return "preco sob consulta";
    try{
      return new Intl.NumberFormat("pt-BR", { style:"currency", currency: currency || "USD" }).format(value);
    }catch(e){
      return (currency || "") + " " + value.toFixed(2);
    }
  }

  function relTime(iso){
    if (!iso) return "sem dados ainda";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "sem dados ainda";
    var diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 1) return "atualizado agora mesmo";
    if (diffMin < 60) return "atualizado ha " + diffMin + " min";
    var h = Math.round(diffMin/60);
    return "atualizado ha " + h + "h";
  }

  function allSingleItems(){
    // todos os itens, menos lotes/leiloes (preco de lote nao e comparavel
    // com o de uma figura avulsa), cada um carregando sua categoria.
    var out = [];
    state.categories.forEach(function(cat){
      if (cat.name === "Lotes e Leilao") return;
      cat.items.forEach(function(it){ out.push(Object.assign({ __cat: cat.name }, it)); });
    });
    return out;
  }

  function dealThreshold(items){
    var prices = items.map(function(it){ return it.price; }).filter(function(p){ return p != null; });
    if (!prices.length) return null;
    prices.sort(function(a,b){ return a-b; });
    var mid = prices[Math.floor(prices.length/2)];
    return mid;
  }

  function renderTabs(){
    tabsEl.innerHTML = "";

    var hBtn = document.createElement("button");
    hBtn.type = "button";
    hBtn.className = "highlight-tab";
    hBtn.setAttribute("aria-selected", String(state.activeTab === HIGHLIGHTS_ID));
    hBtn.innerHTML = "🔥 Destaques";
    hBtn.addEventListener("click", function(){
      state.activeTab = HIGHLIGHTS_ID;
      renderTabs();
      renderMain();
    });
    tabsEl.appendChild(hBtn);

    var div = document.createElement("div");
    div.className = "divider";
    tabsEl.appendChild(div);

    state.categories.forEach(function(cat){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-selected", String(cat.name === state.activeTab));
      btn.innerHTML = cat.name + '<span class="count">' + cat.items.length + "</span>";
      btn.addEventListener("click", function(){
        state.activeTab = cat.name;
        renderTabs();
        renderMain();
      });
      tabsEl.appendChild(btn);
    });
  }

  function cardHtml(item, opts){
    opts = opts || {};
    var img = item.image
      ? '<img src="' + item.image.replace(/"/g,"&quot;") + '" alt="" loading="lazy">'
      : '<span class="ph">🦴</span>';
    var isAuction = (item.buyingOptions || []).indexOf("AUCTION") !== -1;
    var isDeal = opts.deal === true;
    var title = (item.title || "").replace(/</g,"&lt;");
    var seller = item.seller ? item.seller.replace(/</g,"&lt;") : "vendedor desconhecido";
    var cond = item.condition ? item.condition.replace(/</g,"&lt;") : "";
    var catPill = item.__cat ? '<span class="cat-pill">' + item.__cat + '</span>' : "";
    return (
      '<a class="card' + (isDeal ? ' deal' : '') + '" href="' + (item.url||"#") + '" target="_blank" rel="noopener">' +
        '<div class="thumb">' + img + '</div>' +
        '<div class="card-body">' +
          catPill +
          '<div class="price-row"><span class="price">' + fmtPrice(item.price, item.currency) + '</span>' +
            (isDeal ? '<span class="deal-badge">Bom preco</span>' : '') +
            (isAuction ? '<span class="badge">Leilao</span>' : '') +
          '</div>' +
          '<div class="ctitle">' + title + '</div>' +
          '<div class="meta"><span>' + cond + '</span><span>' + seller + '</span></div>' +
        '</div>' +
      '</a>'
    );
  }

  function renderHighlights(){
    var items = allSingleItems();
    if (!items.length){
      mainEl.innerHTML = '<div class="empty"><strong>Nenhum anuncio ainda</strong>Assim que o robo encontrar anuncios, os melhores precos aparecem aqui.</div>';
      return;
    }
    var threshold = dealThreshold(items);
    items.sort(function(a,b){
      if (a.price == null) return 1;
      if (b.price == null) return -1;
      return a.price - b.price;
    });
    var top = items.slice(0, HIGHLIGHTS_COUNT);
    var cards = top.map(function(it){
      return cardHtml(it, { deal: threshold != null && it.price != null && it.price <= threshold });
    }).join("");
    mainEl.innerHTML =
      '<div class="highlights-section">' +
        '<div class="main-head"><h2>Melhores achados agora</h2><div class="sub">Os ' + top.length + ' anuncios mais baratos de figuras avulsas, de todas as abas.</div></div>' +
        '<div class="grid">' + cards + '</div>' +
      '</div>';
  }

  function renderCategory(){
    var cat = state.categories.find(function(c){ return c.name === state.activeTab; });
    if (!cat || !cat.items.length){
      mainEl.innerHTML = '<div class="empty"><strong>Nenhum anuncio nesta categoria agora</strong>Volte mais tarde, o robo atualiza a cada 10 minutos.</div>';
      return;
    }
    var threshold = cat.name === "Lotes e Leilao" ? null : dealThreshold(cat.items);
    var cards = cat.items.map(function(it){
      return cardHtml(it, { deal: threshold != null && it.price != null && it.price <= threshold });
    }).join("");
    mainEl.innerHTML =
      '<div class="main-head"><h2>' + cat.name + '</h2><div class="sub">' + cat.items.length + ' anuncio(s), do menor pro maior preco.</div></div>' +
      '<div class="grid">' + cards + '</div>';
  }

  function renderMain(){
    if (state.activeTab === HIGHLIGHTS_ID){
      renderHighlights();
    } else {
      renderCategory();
    }
  }

  function renderEmptyState(message, detail){
    tabsEl.innerHTML = "";
    mainEl.innerHTML = '<div class="empty"><strong>' + message + '</strong>' + detail + '</div>';
  }

  function applyData(json){
    state.categories = (json.categories || []).filter(function(c){ return c.items && c.items.length; });
    state.updatedAt = json.updated_at || null;
    updatedEl.textContent = relTime(state.updatedAt);
    dotEl.classList.remove("stale");

    if (!state.categories.length){
      renderEmptyState("Nenhum anuncio encontrado ainda", "Assim que o robo rodar e encontrar anuncios, eles aparecem aqui.");
      return;
    }
    renderTabs();
    renderMain();
  }

  function load(){
    dotEl.classList.add("stale");
    updatedEl.textContent = "atualizando…";
    fetch(DATA_URL, { cache: "no-store" })
      .then(function(r){
        if (!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      .then(applyData)
      .catch(function(err){
        dotEl.classList.add("stale");
        updatedEl.textContent = "erro ao carregar";
        renderEmptyState(
          "Nao consegui carregar os dados",
          'Confira se o GitHub Pages esta ativado e se o arquivo <code>data/listings.json</code> existe. Detalhe: ' + err.message
        );
      });
  }

  refreshBtn.addEventListener("click", load);
  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
